# ── CONFIGURACIÓN DE RED INTERNA DE AZURE CONTAINER APPS ─────────────────
# Mapeo directo a los nombres cortos de los servicios internos y sus targetPorts reales
upstream auth_service          { server auth-service:3001; }
upstream inventario_service    { server inventario-service:3002; }
upstream org_service           { server org-service:3003; }
upstream operaciones_service   { server operaciones-service:3004; }
upstream financiero_service    { server financiero-service:3005; }
upstream mantenimiento_service { server mantenimiento-service:3006; }
upstream bus_service           { server bus-service:3007; }

server {
    listen 80;

    # ── Frontend Angular (SPA Clásica) ───────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Health Check del Gateway ─────────────────────────────────────────────
    location = /health {
        return 200 '{"gateway":"nginx","status":"ok","version":"3.0-stable"}';
        add_header Content-Type application/json;
    }

    # ── AUTH-SERVICE (Puerto 3001) ───────────────────────────────────────────
    location /api/v1/auth {
        proxy_pass         http://auth_service/api/v1/emilypamela/auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/usuarios {
        proxy_pass         http://auth_service/api/v1/emilypamela/usuarios;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── INVENTARIO-SERVICE (Puerto 3002) ─────────────────────────────────────
    location /api/v1/vehiculos {
        proxy_pass         http://inventario_service/api/v1/emilypamela/vehiculos;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/marcas { proxy_pass http://inventario_service/api/v1/emilypamela/marcas; }
    location /api/v1/modelos { proxy_pass http://inventario_service/api/v1/emilypamela/modelos; }
    location /api/v1/categorias { proxy_pass http://inventario_service/api/v1/emilypamela/categorias; }
    location /api/v1/extras { proxy_pass http://inventario_service/api/v1/emilypamela/extras; }
    location /api/v1/tipos-combustible { proxy_pass http://inventario_service/api/v1/emilypamela/tipos-combustible; }
    location /api/v1/tipos-transmision { proxy_pass http://inventario_service/api/v1/emilypamela/tipos-transmision; }
    location /api/v1/estados-vehiculo { proxy_pass http://inventario_service/api/v1/emilypamela/estados-vehiculo; }

    # ── ORG-SERVICE (Puerto 3003) ────────────────────────────────────────────
    location /api/v1/empresas { proxy_pass http://org_service/api/v1/emilypamela/empresas; }
    location /api/v1/agencias { proxy_pass http://org_service/api/v1/emilypamela/agencias; }
    location /api/v1/provincias { proxy_pass http://org_service/api/v1/emilypamela/provincias; }
    location /api/v1/ciudades { proxy_pass http://org_service/api/v1/emilypamela/ciudades; }

    # ── OPERACIONES-SERVICE (Puerto 3004) ────────────────────────────────────
    location /api/v1/reservas {
        proxy_pass         http://operaciones_service/api/v1/emilypamela/reservas;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/alquileres { proxy_pass http://operaciones_service/api/v1/emilypamela/alquileres; }
    location /api/v1/devoluciones { proxy_pass http://operaciones_service/api/v1/emilypamela/devoluciones; }
    location /api/v1/admin { proxy_pass http://operaciones_service/api/v1/emilypamela/admin; }
    location /api/v1/seguros { proxy_pass http://operaciones_service/api/v1/emilypamela/seguros; }
    location /api/v1/tarifas { proxy_pass http://operaciones_service/api/v1/emilypamela/tarifas; }
    location /api/v1/canales-venta { proxy_pass http://operaciones_service/api/v1/emilypamela/canales-venta; }
    location /api/v1/historial { proxy_pass http://operaciones_service/api/v1/emilypamela/historial; }
    location /api/v1/outbox-events { proxy_pass http://operaciones_service/api/v1/emilypamela/outbox-events; }

    # ── FINANCIERO-SERVICE (Puerto 3005) ─────────────────────────────────────
    location /api/v1/pagos { proxy_pass http://financiero_service/api/v1/emilypamela/pagos; }
    location /api/v1/facturas { proxy_pass http://financiero_service/api/v1/emilypamela/facturas; }

    # ── MANTENIMIENTO-SERVICE (Puerto 3006) ──────────────────────────────────
    location /api/v1/mantenimientos { proxy_pass http://mantenimiento_service/api/v1/emilypamela/mantenimientos; }
    location /api/v1/kardex { proxy_pass http://mantenimiento_service/api/v1/emilypamela/kardex; }
    location /api/v1/sistemas-externos { proxy_pass http://mantenimiento_service/api/v1/emilypamela/sistemas-externos; }

    # ── BUS-SERVICE / GATEWAY (Puerto 3007) ──────────────────────────────────
    location /api/v1/bus {
        proxy_pass         http://bus_service/api/v1/emilypamela/bus;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}